{% extends "base.html" %}
{% block title %}{{ t.nav_contact }} — {{ t.site_name }}{% endblock %}

{% block content %}
<section class="contact-section" id="contactSection">
    <h2>{{ t.contact_title }}</h2>
    <form class="contact-form" method="post" action="{{ url_for('contact') }}">
        <div class="form-group">
            <label for="name">{{ t.c_name }}</label>
            <input type="text" id="name" name="name" required placeholder="{{ t.c_ph_name }}">
        </div>

        <div class="form-group">
            <label for="email">{{ t.c_email }}</label>
            <input type="email" id="email" name="email" required placeholder="{{ t.c_ph_email }}">
        </div>

        <div class="form-group">
            <label for="subject">{{ t.c_subject }}</label>
            <input type="text" id="subject" name="subject" required placeholder="{{ t.c_ph_subject }}">
        </div>

        <div class="form-group">
            <label for="message">{{ t.c_message }}</label>
            <textarea id="message" name="message" rows="5" required placeholder="{{ t.c_ph_message }}"></textarea>
        </div>

        <button type="submit" class="btn">{{ t.c_send }}</button>
    </form>
</section>
{% endblock %}
